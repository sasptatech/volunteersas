<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VolunteerSAS — Community Chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .cg-cat { border:1px solid var(--line,#E6E1D6); border-radius:14px; margin-bottom:12px; overflow:hidden; background:var(--card,#fff); }
  .cg-sum { list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
  .cg-sum::-webkit-details-marker { display:none; }
  .cg-sum .cg-chev { margin-left:auto; transition:transform .18s; color:var(--ink-soft); }
  details[open] .cg-sum .cg-chev { transform:rotate(90deg); }
  .cg-count { font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--bg,#FAF8F5); padding:2px 8px; border-radius:20px; }
  .cg-body { padding:4px 16px 14px; }
  .cg-intro { font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; }
  .cg-sec { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--red); margin:14px 0 6px; }
  .cg-group { padding:10px 0; border-top:1px solid var(--line,#EEE9DE); display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
  .cg-group:first-child { border-top:none; }
  .cg-name { font-weight:600; font-size:14px; flex:1 1 200px; min-width:0; }
  .cg-note { display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .cg-join { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; text-decoration:none; padding:6px 11px; border-radius:8px; border:1px solid var(--line,#DDD6C8); color:var(--ink); white-space:nowrap; }
  .cg-join:hover { background:var(--bg,#FAF8F5); }
  .cg-empty { color:var(--ink-soft); font-size:13.5px; padding:20px 4px; }
</style>
</head>
<body>
<div id="root"><div class="section"><p style="color:var(--ink-soft)">Loading…</p></div></div>
<div id="ovl"></div>

<script type="module">
import { watchAuth } from "./js/auth.js";
import { renderHeader, esc } from "./js/common.js";
import { CATEGORIES, DISCLAIMER, SOURCE_URL, linkKind } from "./js/chat-groups.js";

const root = document.getElementById('root');

watchAuth((profile, needsProfile) => {
  if (needsProfile) { location.href = 'index.html'; return; }
  renderHeader('community.html');
  render();
}, () => { location.href = 'index.html'; });

const matches = (g, q) =>
  !q || (g.name + ' ' + (g.note || '') + ' ' + (g.section || '')).toLowerCase().includes(q);

function joinsHtml(g) {
  return g.links.map(l => {
    const url = typeof l === 'string' ? l : l.url;
    const kind = linkKind(url);
    const label = (typeof l === 'object' && l.label) ? l.label : kind.label;
    return `<a class="cg-join" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${kind.icon} ${esc(label)}</a>`;
  }).join('');
}

function groupHtml(g) {
  return `<div class="cg-group">
    <div class="cg-name">${esc(g.name)}${g.note ? `<span class="cg-note">${esc(g.note)}</span>` : ''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${joinsHtml(g)}</div>
  </div>`;
}

function categoryHtml(cat, q, openAll) {
  const groups = cat.groups.filter(g => matches(g, q));
  if (!groups.length) return '';
  let lastSec = null, rows = '';
  for (const g of groups) {
    if (g.section && g.section !== lastSec) { rows += `<div class="cg-sec">${esc(g.section)}</div>`; lastSec = g.section; }
    rows += groupHtml(g);
  }
  const open = (openAll || !!q) ? ' open' : '';
  return `<details class="cg-cat"${open}>
    <summary class="cg-sum">${cat.icon} ${esc(cat.title)} <span class="cg-count">${groups.length}</span><span class="cg-chev">›</span></summary>
    <div class="cg-body">
      ${cat.intro ? `<p class="cg-intro">${esc(cat.intro)}</p>` : ''}
      ${rows}
    </div>
  </details>`;
}

function render() {
  root.innerHTML = `<div class="section" style="max-width:720px;margin:0 auto">
    <h1 class="serif" style="font-size:23px;margin-bottom:4px">💬 Community Chats</h1>
    <p style="font-size:13.5px;color:var(--ink-soft);margin-top:0">Parent WhatsApp, WeChat, LINE & Facebook groups across the SAS community. Tap a category to expand, then join the ones you like.</p>

    <div class="card" style="padding:12px 14px;margin-bottom:14px;border-left:4px solid var(--red);font-size:12.5px;color:var(--ink-soft);line-height:1.5">${esc(DISCLAIMER)}</div>

    <input id="cgSearch" placeholder="🔍 Search groups (e.g. Grade 4, Korean, hikers, Woodlands)…" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid var(--line,#DDD6C8);border-radius:10px;font-size:14px;margin-bottom:14px">

    <div id="cgList"></div>

    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:18px">
      Source: <a href="${esc(SOURCE_URL)}" target="_blank" rel="noopener noreferrer" style="color:var(--red)">PTA Community Chat Groups page</a>.
      A link out of date or a group to add? Email <a href="mailto:saspta.secretary@gmail.com" style="color:var(--red)">saspta.secretary@gmail.com</a>.
    </p>
  </div>`;

  const list = document.getElementById('cgList');
  const paint = (q) => {
    const query = (q || '').trim().toLowerCase();
    const html = CATEGORIES.map(c => categoryHtml(c, query, false)).join('');
    list.innerHTML = html || `<div class="cg-empty">No groups match “${esc(q.trim())}”. Try a different word.</div>`;
  };
  paint('');
  document.getElementById('cgSearch').addEventListener('input', e => paint(e.target.value));
}
</script>
</body>
</html>
