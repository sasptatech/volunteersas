<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VolunteerSAS — Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root"><div class="section"><p style="color:var(--ink-soft)">Loading…</p></div></div>
<div id="ovl"></div>

<script type="module">
import { watchAuth, getProfile, isSuperadmin, isAnyAdminTier, ECOSYSTEMS } from "./js/auth.js";
import {
  db, doc, getDoc, updateDoc, deleteDoc, addDoc, collection, onSnapshot, query, where,
  serverTimestamp, arrayUnion, storageRef, uploadBytes, getDownloadURL, deleteObject
} from "./js/firebase-init.js";
import { toast, showOverlay, closeOverlay, bubbleRowHtml, esc, sanitizeHtml, renderHeader } from "./js/common.js";
import { renderChatPanel } from "./js/chat.js";
import { renderAddToCalendar } from "./js/calendar.js";
import { rteHtml, rteValue } from "./js/rte.js";
import { queueEmails } from "./js/email.js";
import { eventComponents, slotLocation, componentConfigHtml, wireComponentConfig, readComponentConfig, deleteEventFully } from "./js/events.js";
import { normalizeTime, timeToMinutes } from "./js/cafe-dates.js";

const root = document.getElementById('root');
const params = new URLSearchParams(location.search);
const eventId = params.get('id');
let ev = null, signups = [], slotSignups = [], itemSignups = [], usersCache = {}, editing = false;
// Media marked for removal in the edit form; applied on Save. Reset when editing starts.
let mediaRemove = { hero: false, photos: [], attachments: [] };

// Flip to true only once ALL of these are done: (1) Brevo account + a verified
// sender, (2) the Firebase "Trigger Email from Firestore" extension installed and
// pointed at Brevo with a default From address, (3) the `mail` rule published in
// the Firestore console. Until then the "Email everyone" button explains it isn't
// connected, so no message is ever silently dropped into an unsent queue.
const EMAIL_ENABLED = true;

if (!eventId) { root.innerHTML = `<div class="section"><p>No event specified.</p></div>`; }

watchAuth((profile, needsProfile) => {
  if (needsProfile) { location.href = 'index.html'; return; }
  renderHeader();
  loadEvent();
}, () => { location.href = 'index.html'; });

function myAdminHere() {
  return ev && (isSuperadmin() || (ev.adminUids || []).includes(getProfile().uid));
}

async function notifyEventAdmins(message) {
  const admins = (ev.adminUids || []).filter(uid => uid !== getProfile().uid);
  for (const uid of admins) {
    try {
      await addDoc(collection(db, 'notifications'), {
        to: uid, from: getProfile().displayName, subject: 'A sign-up was cancelled',
        body: message, read: false, createdAt: serverTimestamp(),
      });
    } catch (e) { /* non-fatal */ }
  }
}

// Gather email addresses for everyone registered for this event, across all
// four sign-up types. Excludes anyone who opted out of email or has no address.
async function collectEmailRecipients() {
  const uids = [...new Set([
    ...signups.map(s => s.uid),
    ...slotSignups.map(s => s.uid),
    ...itemSignups.map(s => s.uid),
  ].filter(Boolean))];
  const emails = [];
  let optedOut = 0, noEmail = 0;
  // Emails live in the PRIVATE users doc (admin-readable). The email button is
  // admin-only, so fetch those directly rather than the public mirror.
  for (const uid of uids) {
    let u = null;
    try {
      const s = await getDoc(doc(db, 'users', uid));
      if (s.exists()) u = s.data();
    } catch (e) { /* not readable — treat as no-email */ }
    if (!u) { noEmail++; continue; }
    if (u.emailOptOut) { optedOut++; continue; }
    if (!u.email) { noEmail++; continue; }
    emails.push(u.email);
  }
  return { emails: [...new Set(emails)], optedOut, noEmail };
}

function loadEvent() {
  onSnapshot(doc(db, 'events', eventId), snap => {
    if (!snap.exists()) { root.innerHTML = `<div class="section"><p>This event no longer exists.</p></div>`; return; }
    ev = { id: snap.id, ...snap.data() };
    render();
  });
  onSnapshot(query(collection(db, 'signups'), where('eventId', '==', eventId)), snap => {
    signups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    hydrateUsers();
  });
  onSnapshot(query(collection(db, 'eventSlotSignups'), where('eventId', '==', eventId)), snap => {
    slotSignups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    hydrateUsers();
  });
  onSnapshot(query(collection(db, 'eventItemSignups'), where('eventId', '==', eventId)), snap => {
    itemSignups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    hydrateUsers();
  });
}

async function hydrateUsers() {
  // Hydrate everyone referenced by any sign-up type — attendees AND volunteers —
  // for the bubble rows. Reads the PUBLIC mirror (name/photo/anonymous only), so
  // any member can see the bubbles without exposing contact details.
  const uids = [...new Set([...signups, ...slotSignups, ...itemSignups].map(s => s.uid).filter(Boolean))]
    .filter(uid => !usersCache[uid]);
  for (const uid of uids) {
    const s = await getDoc(doc(db, 'publicProfiles', uid));
    if (s.exists()) usersCache[uid] = { uid, ...s.data() };
  }
  render();
}

function myProfileRecord() { return getProfile(); }
function mySignup() { return signups.find(s => s.uid === myProfileRecord().uid); }

function render() {
  if (!ev) return;
  const isAdminHere = myAdminHere();
  const attendees = signups.map(s => usersCache[s.uid]).filter(Boolean);
  root.innerHTML = `<div class="section" style="max-width:760px;margin:0 auto">
    <a href="index.html" class="small-link">← Back to Discover</a>

    <div class="card" style="padding:20px;margin-top:12px">
      ${editing ? renderEditForm() : `
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-soft)">${(ev.divisions || []).map(id => (ECOSYSTEMS.find(e => e.id === id) || {}).short || id).join(', ')}</div>
        <h1 class="serif" style="font-size:24px;margin:6px 0">${esc(ev.title || 'Untitled event')}</h1>
        <div style="font-size:13.5px;color:var(--ink-soft);margin-bottom:14px">📅 ${esc(ev.date || '')} ${ev.time ? '· ' + esc(ev.time) + (ev.endTime ? ' – ' + esc(ev.endTime) : '') : ''} · 📍 ${renderLocation()}</div>
        ${heroHtml()}
        <div style="font-size:14px;line-height:1.6">${sanitizeHtml(ev.description || '')}</div>
        <div id="addCalEvent" style="margin-top:10px"></div>
      `}
      ${isAdminHere && !editing ? `<button class="btn btn-ghost" style="margin-top:10px" id="editBtn">✏️ Edit event</button>` : ''}
    </div>

    ${renderParticipationSection(isAdminHere)}

    ${galleryHtml()}

    <div class="card" style="padding:18px;margin-top:16px">
      <h3 style="margin-top:0">💬 Discussion</h3>
      <div id="eventChat"></div>
    </div>

    ${isAdminHere ? `
    <div class="card" style="padding:18px;margin-top:16px;border-left:4px solid var(--navy)">
      <h3 style="margin-top:0">Admin tools</h3>
      <button class="btn btn-secondary" id="emailAllBtn">✉️ Email everyone registered</button>
      <div style="margin-top:14px">
        <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft)">Add a co-admin for this event</label>
        <div id="addCoAdminWrap" style="margin-top:6px">Loading eligible admins…</div>
      </div>
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
        <button class="small-link" style="color:var(--red)" id="deleteEventBtn">🗑 Delete this event</button>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">Removes the event and all its sign-ups. Can't be undone.</div>
      </div>
    </div>` : ''}
  </div>`;

  renderChatPanel('eventChat', 'event', eventId, { canModerate: isAdminHere });
  if (document.getElementById('addCalEvent')) {
    // Use the real end time for the calendar entry's length when it's set.
    let durationHrs = 2;
    if (ev.time && ev.endTime) {
      const d = (timeToMinutes(ev.endTime) - timeToMinutes(ev.time)) / 60;
      if (d > 0) durationHrs = d;
    }
    renderAddToCalendar('addCalEvent', {
      title: ev.title, date: ev.date, startTime: ev.time, durationHrs,
      location: ev.location, description: ev.description,
    });
  }
  wireHandlers(isAdminHere);
  if (isAdminHere) loadCoAdminPicker();
}

// Cover media shown at the top of the description card (image inline, PDF embedded).
function heroHtml() {
  if (!ev.heroUrl) return '';
  if (ev.heroType === 'pdf') {
    return `<object data="${esc(ev.heroUrl)}" type="application/pdf" style="width:100%;height:60vh;min-height:340px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">
      <a href="${esc(ev.heroUrl)}" target="_blank" class="small-link">Open the attached PDF ↗</a></object>`;
  }
  return `<img src="${esc(ev.heroUrl)}" alt="" style="width:100%;border-radius:10px;margin-bottom:12px;display:block">`;
}

// Additional photos + docs: thumbnail row. Photos open a blurred lightbox carousel.
function galleryHtml() {
  const photos = ev.photos || [], docs = ev.attachments || [];
  if (!photos.length && !docs.length) return '';
  return `<div class="card" style="padding:18px;margin-top:16px">
    <h3 style="margin-top:0">More photos & documents</h3>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      ${photos.map((url, i) => `<div onclick="window.__lightbox(${i})" title="Click to enlarge" style="width:92px;height:92px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line)"><img src="${esc(url)}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`).join('')}
      ${docs.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener" style="width:92px;height:92px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--ink);padding:6px;text-align:center"><div style="font-size:26px">📄</div><div style="font-size:10px;line-height:1.2;overflow:hidden;max-height:24px">${esc(d.name)}</div></a>`).join('')}
    </div>
  </div>`;
}

function renderLocation() {
  return esc(ev.location || '');
}

function renderParticipationSection(isAdminHere) {
  const c = eventComponents(ev);
  if (!c.rsvp && !c.slots && !c.items) {
    // Save the Date — no components open yet.
    return `<div class="card" style="padding:18px;margin-top:16px">
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0">📌 Save the date — sign-ups aren't open yet. Check back for details.</p>
      ${isAdminHere ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="window.__openComponent('rsvpEnabled')">Open RSVP</button>
        <button class="btn btn-ghost" onclick="window.__openComponent('volunteerSlotsEnabled')">Open volunteer slots</button>
        <button class="btn btn-ghost" onclick="window.__openComponent('itemSignupEnabled')">Open item sign-up</button>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">Use “Edit event” to set details (slots, capacity, etc.).</div>` : ''}
    </div>`;
  }
  return [
    c.rsvp ? renderRsvpSection(isAdminHere) : '',
    c.slots ? renderSlotGroupsSection(isAdminHere) : '',
    c.items ? renderItemCategoriesSection(isAdminHere) : '',
  ].join('');
}

// Total people attending = each RSVP (1) plus any guests they're bringing.
function attendingCount() { return signups.reduce((n, s) => n + 1 + (s.guests || 0), 0); }

function renderRsvpSection(isAdminHere) {
  const attendees = signups.map(s => usersCache[s.uid]).filter(Boolean);
  const count = attendingCount();
  const guestTotal = count - signups.length;
  const cap = ev.rsvpCapacity || 0;
  const full = cap > 0 && count >= cap;
  return `<div class="card" style="padding:18px;margin-top:16px">
    <h3 style="margin-top:0">Attending (${count}${cap ? ' / ' + cap : ''})${guestTotal > 0 ? ` <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">incl. ${guestTotal} ${guestTotal === 1 ? 'guest' : 'guests'}</span>` : ''}</h3>
    ${bubbleRowHtml(attendees, 20)}
    ${isAdminHere ? renderAttendeeAdminList(attendees) : ''}
    <div style="margin-top:14px">
      ${mySignup()
        ? `<button class="btn btn-ghost" id="unrsvpBtn">Un-RSVP</button>`
        : (full
          ? `<span class="chip" style="background:#E3F3EC;color:#0E8A6D">Event full</span>`
          : `<button class="btn btn-primary" id="rsvpBtn">RSVP</button>`)}
    </div>
  </div>`;
}

function renderSlotGroupsSection(isAdminHere) {
  const groups = (ev.slotGroups || []);
  const volunteers = slotSignups.map(s => usersCache[s.uid]).filter(Boolean);
  return `<div class="card" style="padding:18px;margin-top:16px">
    <h3 style="margin-top:0">Volunteering (${slotSignups.length})</h3>
    ${volunteers.length ? bubbleRowHtml(volunteers, 20) : ''}
    <div style="margin-top:${volunteers.length ? '12' : '0'}px">
    ${!groups.length ? `<p style="color:var(--ink-soft);font-size:13px">No slots have been set up yet.</p>` : groups.map(g => {
      const filled = slotSignups.filter(s => s.slotGroupId === g.id);
      const spotsLeft = g.capacity - filled.length;
      const loc = slotLocation(ev, g);
      let rows = filled.map(s => `<div style="font-size:12.5px;padding:4px 0;display:flex;justify-content:space-between">
          <span><strong>${esc(s.name)}</strong>${s.comment ? ` — <span style="color:var(--ink-soft)">${esc(s.comment)}</span>` : ''}</span>
          ${s.uid === getProfile().uid || isAdminHere ? `<button class="small-link" style="color:var(--red)" onclick="window.__removeSlotSignup('${s.id}')">Remove</button>` : ''}
        </div>`).join('');
      for (let i = 0; i < spotsLeft; i++) rows += `<div style="font-size:12.5px;padding:4px 0;color:var(--ink-soft)">Open slot — <button class="small-link" onclick="window.__openSlotSignup('${g.id}')">Sign up</button></div>`;
      return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-weight:600;font-size:13.5px">${esc(g.label)} <span style="color:var(--ink-soft);font-weight:400">(${esc(g.startTime)}–${esc(g.endTime)})</span>${ev.multiLocation && loc ? `<br><span style="font-size:12px;color:var(--ink-soft);font-weight:400">📍 ${esc(loc)}</span>` : ''}</span>
          <span class="chip" style="background:${spotsLeft<=0?'#E3F3EC':'#FDF1D8'};color:${spotsLeft<=0?'#0E8A6D':'#96721E'}">${spotsLeft<=0?'Full':spotsLeft+' open'}</span>
        </div>
        <div style="margin-top:6px">${rows}</div>
      </div>`;
    }).join('')}
    </div>
  </div>`;
}

function renderItemCategoriesSection(isAdminHere) {
  // Ordered by the admin's chosen priority; quota is display-only guidance and
  // never blocks sign-up (people can go under or over the goal).
  const cats = (ev.itemCategories || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  return `<div class="card" style="padding:18px;margin-top:16px">
    <h3 style="margin-top:0">Bring Something</h3>
    ${!cats.length ? `<p style="color:var(--ink-soft);font-size:13px">No items have been requested yet.</p>` : cats.map(c => {
      const signed = itemSignups.filter(s => s.categoryId === c.id);
      const rows = signed.map(s => `<div style="font-size:12.5px;padding:4px 0;display:flex;justify-content:space-between">
          <span><strong>${esc(s.name)}</strong> — ${esc(s.item)}</span>
          ${s.uid === getProfile().uid || isAdminHere ? `<button class="small-link" style="color:var(--red)" onclick="window.__removeItemSignup('${s.id}')">Remove</button>` : ''}
        </div>`).join('');
      return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;font-size:13.5px">${esc(c.label)}${c.quota ? ` <span style="color:var(--ink-soft);font-weight:400">(goal: ${c.quota})</span>` : ''}</span>
          <span class="chip" style="background:#EEF3F8;color:#33506E">${signed.length} signed up</span>
        </div>
        <div style="margin-top:6px">${rows}</div>
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:12.5px" onclick="window.__openItemSignup('${c.id}')">+ Sign up to bring something</button>
      </div>`;
    }).join('')}
  </div>`;
}

function renderAttendeeAdminList(attendees) {
  return `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
    ${signups.map(s => {
      const u = usersCache[s.uid];
      const name = u ? (u.anonymous ? 'Anonymous' : u.displayName) : (s.name || 'Unknown');
      const guests = s.guests || 0;
      const guestNames = (s.guestNames || []).filter(Boolean);
      return `<div style="font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span><strong>${esc(name)}</strong>${guests > 0 ? ` <span style="color:var(--ink-soft)">+${guests} ${guests === 1 ? 'guest' : 'guests'}</span>` : ''}</span>
          <button class="small-link" style="color:var(--red)" onclick="window.__unrsvpOther('${s.id}','${s.uid}')">Un-RSVP</button>
        </div>
        ${guestNames.length ? `<div style="color:var(--ink-soft);font-size:11.5px">Guests: ${esc(guestNames.join(', '))}</div>` : ''}
        ${s.comment ? `<div style="color:var(--ink-soft);font-size:11.5px">💬 ${esc(s.comment)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderEditForm() {
  return `
    <div class="form-row"><label>Title</label><input id="edTitle" value="${esc(ev.title || '')}"></div>
    <div class="form-row"><label>Date</label><input id="edDate" type="date" value="${esc(ev.date || '')}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row" style="margin:0"><label>Start time</label><input list="ecHalfHours" id="edTime" value="${esc(ev.time || '')}" placeholder="e.g. 9:00 AM"></div>
      <div class="form-row" style="margin:0"><label>End time (optional)</label><input list="ecHalfHours" id="edEndTime" value="${esc(ev.endTime || '')}" placeholder="e.g. 11:00 AM"></div>
    </div>
    <div class="form-row"><label>Location</label><input id="edLoc" value="${esc(ev.location || '')}"></div>
    <div id="ecConfig">${componentConfigHtml(ev)}</div>
    <div class="form-row"><label>Description</label>${rteHtml('edDescRTE', ev.description || '')}</div>
    <div class="form-row"><label>Cover image / PDF (shows at the top of the description)</label>
      ${ev.heroUrl ? `<div id="edHeroExisting" style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        ${ev.heroType === 'pdf' ? '<span style="font-size:13px">📄 Current cover PDF</span>' : `<img src="${esc(ev.heroUrl)}" style="height:52px;border-radius:6px">`}
        <button type="button" class="small-link" style="color:var(--red)" onclick="window.__markRemoveHero(this)">Remove</button>
      </div>` : ''}
      <input type="file" id="edCover" accept="application/pdf,image/*">
    </div>
    <div class="form-row"><label>Additional photos</label>
      ${(ev.photos || []).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px">${(ev.photos || []).map((url, i) => `<div class="ed-existing-photo" style="position:relative;width:56px;height:56px"><img src="${esc(url)}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;display:block"><button type="button" onclick="window.__markRemovePhoto(${i},this)" title="Remove" style="position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;line-height:1;cursor:pointer;font-size:11px">✕</button></div>`).join('')}</div>` : ''}
      <input type="file" id="edPhotos" multiple accept="image/*">
    </div>
    <div class="form-row"><label>Additional documents</label>
      ${(ev.attachments || []).length ? `<div style="margin-bottom:6px">${(ev.attachments || []).map((a, i) => `<div class="ed-existing-doc" style="font-size:12.5px;padding:2px 0">📄 ${esc(a.name)} <button type="button" class="small-link" style="color:var(--red)" onclick="window.__markRemoveDoc(${i},this)">remove</button></div>`).join('')}</div>` : ''}
      <input type="file" id="edAttachments" multiple>
    </div>
    <div class="form-row"><label>Divisions</label>
      <div class="role-grid">${ECOSYSTEMS.map(e => `<button type="button" class="role-opt ${((ev.divisions || []).includes(e.id)) ? 'active' : ''}" data-div="${e.id}">${e.icon} ${e.name}</button>`).join('')}</div>
    </div>
    <button class="btn btn-primary" id="saveEditBtn">Save changes</button>
    <button class="btn btn-ghost" id="cancelEditBtn" style="margin-left:8px">Cancel</button>`;
}

function wireHandlers(isAdminHere) {
  const editBtn = document.getElementById('editBtn');
  if (editBtn) editBtn.onclick = () => { mediaRemove = { hero: false, photos: [], attachments: [] }; editing = true; render(); };
  const cancelBtn = document.getElementById('cancelEditBtn');
  if (cancelBtn) cancelBtn.onclick = () => { editing = false; render(); };

  // Quick-enable a component straight from the Save-the-Date state.
  window.__openComponent = async (field) => {
    if (!myAdminHere()) return;
    try { await updateDoc(doc(db, 'events', eventId), { [field]: true }); toast('Opened.'); }
    catch (e) { toast('Could not open: ' + e.message); }
  };

  // Mark existing media for removal (applied on Save). Just hides the thumbnail.
  window.__markRemoveHero = (btn) => { mediaRemove.hero = true; const el = document.getElementById('edHeroExisting'); if (el) el.style.display = 'none'; };
  window.__markRemovePhoto = (i, btn) => { const u = (ev.photos || [])[i]; if (u) mediaRemove.photos.push(u); const c = btn.closest('.ed-existing-photo'); if (c) c.style.display = 'none'; };
  window.__markRemoveDoc = (i, btn) => { const a = (ev.attachments || [])[i]; if (a) mediaRemove.attachments.push(a.url); const c = btn.closest('.ed-existing-doc'); if (c) c.style.display = 'none'; };

  // Blurred full-screen lightbox carousel over the event's photos.
  window.__lightbox = (index) => {
    const photos = ev.photos || [];
    if (!photos.length) return;
    let i = index;
    const show = () => showOverlay(`<div onclick="if(event.target===this)window.closeOverlay()" style="position:fixed;inset:0;background:rgba(20,18,15,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:3000">
        <button onclick="window.closeOverlay()" aria-label="Close" style="position:absolute;top:14px;right:20px;font-size:30px;background:none;border:none;color:#fff;cursor:pointer;line-height:1">✕</button>
        ${photos.length > 1 ? `<button onclick="window.__lbNav(-1)" aria-label="Previous" style="position:absolute;left:12px;font-size:38px;background:none;border:none;color:#fff;cursor:pointer">‹</button>` : ''}
        <img src="${esc(photos[i])}" style="max-width:90vw;max-height:86vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.5)">
        ${photos.length > 1 ? `<button onclick="window.__lbNav(1)" aria-label="Next" style="position:absolute;right:12px;font-size:38px;background:none;border:none;color:#fff;cursor:pointer">›</button>` : ''}
        ${photos.length > 1 ? `<div style="position:absolute;bottom:16px;color:#fff;font-size:13px">${i + 1} / ${photos.length}</div>` : ''}
      </div>`, true);
    window.__lbNav = (d) => { i = (i + d + photos.length) % photos.length; show(); };
    show();
  };

  const saveBtn = document.getElementById('saveEditBtn');
  if (saveBtn) {
    // Edit form is on screen — wire its component config + division toggles.
    wireComponentConfig(document.getElementById('root'));
    document.querySelectorAll('#root .role-opt').forEach(b => b.onclick = () => b.classList.toggle('active'));
    saveBtn.onclick = async () => {
    const divisions = [...document.querySelectorAll('#root .role-opt.active')].map(b => b.dataset.div);
    const cfg = readComponentConfig();
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const { storage } = await import("./js/firebase-init.js");
      const tryDelete = async (url) => { try { await deleteObject(storageRef(storage, url)); } catch (e) { /* already gone */ } };

      // Reconcile media: start from current arrays minus anything marked for removal.
      let photos = (ev.photos || []).filter(u => !mediaRemove.photos.includes(u));
      let attachments = (ev.attachments || []).filter(a => !mediaRemove.attachments.includes(a.url));
      let heroUrl = ev.heroUrl || '', heroType = ev.heroType || '';
      for (const u of mediaRemove.photos) tryDelete(u);
      for (const u of mediaRemove.attachments) tryDelete(u);
      if (mediaRemove.hero) { if (heroUrl) tryDelete(heroUrl); heroUrl = ''; heroType = ''; }

      // New cover (replaces any existing).
      const coverFile = document.getElementById('edCover').files[0];
      if (coverFile) {
        if (heroUrl) tryDelete(heroUrl);
        const isPdf = coverFile.type === 'application/pdf' || /\.pdf$/i.test(coverFile.name);
        const folder = isPdf ? 'eventAttachments' : 'eventPhotos';
        const r = storageRef(storage, `${folder}/${eventId}/cover_${Date.now()}_${coverFile.name}`);
        await uploadBytes(r, coverFile);
        heroUrl = await getDownloadURL(r); heroType = isPdf ? 'pdf' : 'image';
      }
      // New additional photos + docs.
      for (const file of [...document.getElementById('edPhotos').files]) {
        const r = storageRef(storage, `eventPhotos/${eventId}/${Date.now()}_${file.name}`);
        await uploadBytes(r, file); photos.push(await getDownloadURL(r));
      }
      for (const file of [...document.getElementById('edAttachments').files]) {
        const r = storageRef(storage, `eventAttachments/${eventId}/${Date.now()}_${file.name}`);
        await uploadBytes(r, file); attachments.push({ name: file.name, url: await getDownloadURL(r) });
      }

      await updateDoc(doc(db, 'events', eventId), {
        title: document.getElementById('edTitle').value.trim(),
        date: document.getElementById('edDate').value,
        time: normalizeTime(document.getElementById('edTime').value),
        endTime: normalizeTime(document.getElementById('edEndTime').value),
        location: document.getElementById('edLoc').value.trim(),
        description: rteValue('edDescRTE'),
        divisions, ...cfg,
        heroUrl, heroType, photos, attachments,
      });
      editing = false; toast('Event updated.');
    } catch (e) { toast('Could not save: ' + e.message); saveBtn.disabled = false; saveBtn.textContent = 'Save changes'; }
    };
  }

  const deleteEventBtn = document.getElementById('deleteEventBtn');
  if (deleteEventBtn) deleteEventBtn.onclick = async () => {
    if (!myAdminHere()) return;
    if (!confirm(`Delete "${ev.title}" and all its sign-ups? This can't be undone.`)) return;
    deleteEventBtn.disabled = true; deleteEventBtn.textContent = 'Deleting…';
    try {
      await deleteEventFully(eventId, ev);
      toast('Event deleted.');
      location.href = 'index.html';
    } catch (e) { deleteEventBtn.disabled = false; deleteEventBtn.textContent = '🗑 Delete this event'; toast('Could not delete: ' + e.message); }
  };

  const rsvpBtn = document.getElementById('rsvpBtn');
  if (rsvpBtn) rsvpBtn.onclick = () => window.__openRsvp();

  window.__openRsvp = () => {
    const maxExtra = ev.rsvpMaxGuests || 0;
    const requireNames = !!ev.rsvpRequireGuestNames;
    const opts = [];
    for (let i = 0; i <= maxExtra; i++) opts.push(i);
    showOverlay(`<div class="modal" style="position:relative">
      <button class="close-x" onclick="closeOverlay()">✕</button>
      <h2>RSVP — ${esc(ev.title || '')}</h2>
      ${maxExtra > 0 ? `<div class="form-row"><label>Bringing guests?</label>
        <select id="rsvpGuests">${opts.map(n => `<option value="${n}">${n === 0 ? 'Just me' : n + (n === 1 ? ' guest' : ' guests')}</option>`).join('')}</select>
      </div><div id="rsvpGuestNames"></div>` : ''}
      <div class="form-row"><label>Comment (optional — dietary notes, questions)</label><textarea id="rsvpComment" rows="2"></textarea></div>
      <button class="btn btn-primary" style="width:100%" id="confirmRsvp">Confirm RSVP</button>
    </div>`);
    const renderNames = () => {
      if (!requireNames || maxExtra <= 0) return;
      const n = parseInt(document.getElementById('rsvpGuests').value, 10) || 0;
      document.getElementById('rsvpGuestNames').innerHTML = Array.from({ length: n }, (_, i) =>
        `<div class="form-row"><label>Guest ${i + 1} name</label><input class="rsvp-guest-name" placeholder="Name"></div>`).join('');
    };
    if (maxExtra > 0) { document.getElementById('rsvpGuests').onchange = renderNames; renderNames(); }
    document.getElementById('confirmRsvp').onclick = async () => {
      const guests = maxExtra > 0 ? (parseInt(document.getElementById('rsvpGuests').value, 10) || 0) : 0;
      const guestNames = [...document.querySelectorAll('.rsvp-guest-name')].map(i => i.value.trim()).filter(Boolean);
      if (requireNames && guests > 0 && guestNames.length < guests) { toast("Please enter each guest's name."); return; }
      const cap = ev.rsvpCapacity || 0;
      if (cap > 0 && attendingCount() + 1 + guests > cap) { toast('Not enough spots left for that group size.'); return; }
      const btn = document.getElementById('confirmRsvp'); btn.disabled = true; btn.textContent = 'Confirming…';
      try {
        await addDoc(collection(db, 'signups'), {
          eventId, uid: getProfile().uid, name: getProfile().displayName,
          guests, guestNames, comment: document.getElementById('rsvpComment').value.trim(),
          createdAt: serverTimestamp(),
        });
        closeOverlay(); toast('RSVP confirmed!');
      } catch (e) { btn.disabled = false; btn.textContent = 'Confirm RSVP'; toast('Could not RSVP: ' + e.message); }
    };
  };
  const unrsvpBtn = document.getElementById('unrsvpBtn');
  if (unrsvpBtn) unrsvpBtn.onclick = async () => {
    const s = mySignup(); if (!s) return;
    try {
      await deleteDoc(doc(db, 'signups', s.id));
      await notifyEventAdmins(`${getProfile().displayName} un-RSVP'd from "${ev.title}".`);
      toast('Un-RSVP\'d.');
    } catch (e) { toast('Could not un-RSVP: ' + e.message); }
  };
  window.__unrsvpOther = async (signupId, uid) => {
    if (!confirm('Un-RSVP this person from the event?')) return;
    try {
      await deleteDoc(doc(db, 'signups', signupId));
      await addDoc(collection(db, 'notifications'), {
        to: uid, from: getProfile().displayName, subject: 'You were un-RSVP\'d',
        body: `An admin removed your RSVP for "${ev.title}".`, read: false, createdAt: serverTimestamp(),
      });
      toast('Removed and notified.');
    } catch (e) { toast('Could not remove: ' + e.message); }
  };

  window.__openSlotSignup = (slotGroupId) => {
    const g = (ev.slotGroups || []).find(x => x.id === slotGroupId); if (!g) return;
    showOverlay(`<div class="modal" style="position:relative">
      <button class="close-x" onclick="closeOverlay()">✕</button>
      <h2>Sign up — ${esc(g.label)}</h2>
      <p style="font-size:13.5px;color:var(--ink-soft)">${esc(g.startTime)}–${esc(g.endTime)}</p>
      <div class="form-row"><label>Comment (optional)</label><textarea id="slotComment" rows="2"></textarea></div>
      <button class="btn btn-primary" style="width:100%" id="confirmSlotSignup">Confirm</button>
    </div>`);
    document.getElementById('confirmSlotSignup').onclick = async () => {
      const filled = slotSignups.filter(s => s.slotGroupId === slotGroupId);
      if (filled.length >= g.capacity) { toast('That slot just filled.'); return; }
      try {
        await addDoc(collection(db, 'eventSlotSignups'), {
          eventId, slotGroupId, uid: getProfile().uid, name: getProfile().displayName,
          comment: document.getElementById('slotComment').value.trim(), createdAt: serverTimestamp(),
        });
        closeOverlay(); toast('Signed up!');
      } catch (e) { toast('Could not sign up: ' + e.message); }
    };
  };
  window.__removeSlotSignup = async (id) => {
    const s = slotSignups.find(x => x.id === id);
    try {
      await deleteDoc(doc(db, 'eventSlotSignups', id));
      if (s && s.uid === getProfile().uid) {
        const g = (ev.slotGroups || []).find(x => x.id === s.slotGroupId) || {};
        await notifyEventAdmins(`${getProfile().displayName} cancelled their "${g.label || 'slot'}" sign-up for "${ev.title}".`);
      }
      toast('Removed.');
    } catch (e) { toast('Could not remove: ' + e.message); }
  };

  window.__openItemSignup = (categoryId) => {
    const c = (ev.itemCategories || []).find(x => x.id === categoryId); if (!c) return;
    showOverlay(`<div class="modal" style="position:relative">
      <button class="close-x" onclick="closeOverlay()">✕</button>
      <h2>Sign up — ${esc(c.label)}</h2>
      <div class="form-row"><label>What are you bringing?</label><input id="itemDesc" placeholder="e.g. Chocolate chip cookies"></div>
      <button class="btn btn-primary" style="width:100%" id="confirmItemSignup">Confirm</button>
    </div>`);
    document.getElementById('confirmItemSignup').onclick = async () => {
      const item = document.getElementById('itemDesc').value.trim();
      if (!item) { toast('Please say what you\'re bringing.'); return; }
      const signed = itemSignups.filter(s => s.categoryId === categoryId);
      if (signed.length >= c.quota) { toast('This category is already full.'); return; }
      try {
        await addDoc(collection(db, 'eventItemSignups'), {
          eventId, categoryId, uid: getProfile().uid, name: getProfile().displayName, item, createdAt: serverTimestamp(),
        });
        closeOverlay(); toast('Signed up!');
      } catch (e) { toast('Could not sign up: ' + e.message); }
    };
  };
  window.__removeItemSignup = async (id) => {
    const s = itemSignups.find(x => x.id === id);
    try {
      await deleteDoc(doc(db, 'eventItemSignups', id));
      if (s && s.uid === getProfile().uid) {
        await notifyEventAdmins(`${getProfile().displayName} cancelled bringing "${s.item}" for "${ev.title}".`);
      }
      toast('Removed.');
    } catch (e) { toast('Could not remove: ' + e.message); }
  };

  const emailBtn = document.getElementById('emailAllBtn');
  if (emailBtn) emailBtn.onclick = async () => {
    if (!EMAIL_ENABLED) {
      toast("Email sending isn't connected yet — the PTA is still finishing setup.");
      return;
    }
    emailBtn.disabled = true;
    const originalLabel = emailBtn.textContent;
    emailBtn.textContent = 'Gathering recipients…';
    let recipients;
    try { recipients = await collectEmailRecipients(); }
    finally { emailBtn.disabled = false; emailBtn.textContent = originalLabel; }
    const { emails, optedOut, noEmail } = recipients;
    if (emails.length === 0) {
      toast((optedOut || noEmail)
        ? 'No one to email — everyone registered has opted out or has no email.'
        : 'No one has registered yet.');
      return;
    }
    const notes = [];
    if (optedOut) notes.push(`${optedOut} opted out`);
    if (noEmail) notes.push(`${noEmail} without an email`);
    showOverlay(`<div class="modal" style="position:relative">
      <button class="close-x" onclick="closeOverlay()">✕</button>
      <h2>Email everyone registered</h2>
      <p style="font-size:13.5px;color:var(--ink-soft)">
        Sending to <strong>${emails.length}</strong> ${emails.length === 1 ? 'person' : 'people'} registered for "${esc(ev.title)}".
        ${notes.length ? `<br>(${notes.join(', ')} — not included.)` : ''}
        <br>Each person gets their own email — nobody sees anyone else's address.
      </p>
      <div class="form-row"><label>Subject</label><input id="emSubject" value="${esc(ev.title)} — a message from the organizers"></div>
      <div class="form-row"><label>Replies go to</label><input id="emReplyTo" value="${esc((getProfile() || {}).email || '')}" placeholder="you@example.com"></div>
      ${(getProfile() || {}).email ? `<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:12px"><input type="checkbox" id="emCopyMe" style="width:auto"> Send me a copy too</label>` : ''}
      <div class="form-row"><label>Message</label><textarea id="emBody" rows="7" placeholder="Write your message to everyone who registered…"></textarea></div>
      <button class="btn btn-primary" style="width:100%" id="confirmEmail">Send email</button>
    </div>`);
    document.getElementById('confirmEmail').onclick = async () => {
      const subject = document.getElementById('emSubject').value.trim();
      const body = document.getElementById('emBody').value.trim();
      if (!subject) { toast('Please add a subject.'); return; }
      if (!body) { toast('Please write a message.'); return; }
      const btn = document.getElementById('confirmEmail');
      btn.disabled = true; btn.textContent = 'Sending…';
      const me = getProfile();
      const replyTo = document.getElementById('emReplyTo').value.trim();
      const copyMeEl = document.getElementById('emCopyMe');
      // Add myself only if not already a recipient, so I never get two copies.
      const recipients = (copyMeEl && copyMeEl.checked && me.email && !emails.includes(me.email))
        ? [...emails, me.email] : emails;
      try {
        await queueEmails({
          recipients, subject, body, replyTo,
          reason: "You're receiving this because you registered for a PTA event.",
          scope: 'event', meta: { eventId },
        });
        // Accountability trail (Superadmin-visible audit log).
        try {
          await addDoc(collection(db, 'auditLog'), {
            actorUid: me.uid, actorName: me.displayName, action: 'event_email_sent',
            eventId, subject, recipientCount: recipients.length, createdAt: serverTimestamp(),
          });
        } catch (e) { /* non-fatal */ }
        closeOverlay();
        toast(`Email queued to ${recipients.length} ${recipients.length === 1 ? 'person' : 'people'}.`);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Send email';
        toast('Could not send: ' + e.message);
      }
    };
  };
}

async function loadCoAdminPicker() {
  const { getDocs, collection: col } = await import("./js/firebase-init.js");
  const snap = await getDocs(col(db, 'users'));
  const eligible = snap.docs.map(d => ({ uid: d.id, ...d.data() }))
    .filter(u => (u.isAdmin || u.isStoreAdmin || u.isSuperadmin) && !(ev.adminUids || []).includes(u.uid));
  const wrap = document.getElementById('addCoAdminWrap');
  if (!wrap) return;
  wrap.innerHTML = eligible.length
    ? `<select id="coAdminSelect">${eligible.map(u => `<option value="${u.uid}">${esc(u.displayName)}</option>`).join('')}</select>
       <button class="btn btn-ghost" id="addCoAdminBtn" style="margin-left:6px">Add</button>`
    : `<p style="color:var(--ink-soft);font-size:12.5px">No eligible Admin/Store Admin users to add yet.</p>`;
  const btn = document.getElementById('addCoAdminBtn');
  if (btn) btn.onclick = async () => {
    const uid = document.getElementById('coAdminSelect').value;
    try { await updateDoc(doc(db, 'events', eventId), { adminUids: arrayUnion(uid) }); toast('Co-admin added.'); }
    catch (e) { toast('Could not add: ' + e.message); }
  };
}
</script>
</body>
</html>
